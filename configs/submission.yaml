# Frozen inference settings of the uploaded challenge submission (code 3204f04).
# run_pipeline.py passes every value here explicitly, so no stage relies on its own defaults.
# Changing anything here means the output is no longer the submitted pipeline.

weights:  # file name inside --weights-dir, and the sha256 it must have
  detector:    {file: detector_471b3fff.pth,    sha256: 471b3fff3f77d320f9c84cdc1d8978d8a1b6162d6813915c1d8e0c700955f80a}
  eligibility: {file: eligibility_4d403c88.pt,  sha256: 4d403c88ad87819e86a4e7b3a79dfdaeae09369d8342ec93725df6dd74dd43f2}
