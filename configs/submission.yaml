detector:  # src/infer/detect_video.py: every frame, scaled to 720p, conf floor 0.05 (constants in the module)
  previews: 8

jnr:  # src/infer/jnr_video.py; ViTPose revision is pinned in src/core/config.py (CropCfg)
  every: 2
  min_conf: 0.3

colour:  # src/team/run.py
  seed: 0

tracker:  # src/tracker/run_ucmc.py, setting ft_guard_lock30 (docs/15, docs/19)
  cdt: 8
  ambiguity: 1.0
  team_scale: 6.0
  overlap_raw: 1
  q_bins: "0:0.9999,0.001:0.9996,0.2:0.9926,0.4:0.9375,0.5:0.8615,0.6:0.8215"
  guard_iou: 0.4
  guard_front_px: 20
  team_lock_frames: 30

stitching:  # src/tracker/jnr_tracks.py; its Params defaults are the submitted ones
  smooth_sigma: 4.0

